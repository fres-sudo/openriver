name: macOS beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic beta version, for example 0.1.0-beta.1
        required: true
        type: string
      build_number:
        description: Unique positive integer build number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-beta
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Run release checks
        run: dart run melos run check
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/openriver-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security default-keychain -d user -s "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          printf 'OPENRIVER_KEYCHAIN=%s\n' "$keychain" >> "$GITHUB_ENV"
      - name: Configure notarization credentials
        env:
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_$MACOS_NOTARY_KEY_ID.p8"
          printf '%s' "$MACOS_NOTARY_KEY_BASE64" | base64 -D > "$key_path"
          xcrun notarytool store-credentials openriver-beta \
            --key "$key_path" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID"
      - name: Build sign and notarize beta
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_PROFILE: openriver-beta
          MACOS_BETA_VERSION: ${{ inputs.version }}
          MACOS_BUILD_NUMBER: ${{ inputs.build_number }}
        run: ./scripts/package_macos_beta.sh
      - name: Upload beta artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openriver-macos-${{ inputs.version }}+${{ inputs.build_number }}
          path: |
            build/beta/macos/*.zip
            build/beta/macos/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [[ -n "${OPENRIVER_KEYCHAIN:-}" ]]; then
            security delete-keychain "$OPENRIVER_KEYCHAIN"
          fi
