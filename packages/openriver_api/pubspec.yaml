name: openriver_api
description: Typed Dart facade and native build integration for the OpenRiver Rust core.
version: 0.1.0
publish_to: none
resolution: workspace
environment:
  sdk: ^3.11.0
  flutter: '>=3.41.2'
dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.12.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
